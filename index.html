<html lang="ka">
<head>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one reading column. Header with search, module chips, then a list of
     error cards. Error text is styled like an SAP status-bar message. */
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --fg: #17202b;
    --muted: #5d6a79;
    --line: #d6dde5;
    --accent: #0a6ed1;
    --accent-soft: #e3effb;
    --err: #bb0000;
    --err-soft: #fdecec;
    --warn: #8a5300;
    --warn-soft: #fff3df;
    --body: "Noto Sans Georgian", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11161c; --surface: #1a222b; --fg: #e6ebf0; --muted: #98a5b3; --line: #2c3743;
      --accent: #5aa7f0; --accent-soft: #1b3047; --err: #ff7b72; --err-soft: #3a1e20;
      --warn: #f0b45a; --warn-soft: #3a2c15; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11161c; --surface: #1a222b; --fg: #e6ebf0; --muted: #98a5b3; --line: #2c3743;
    --accent: #5aa7f0; --accent-soft: #1b3047; --err: #ff7b72; --err-soft: #3a1e20;
    --warn: #f0b45a; --warn-soft: #3a2c15; color-scheme: dark;
  }

  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--body); font-size: 16px; line-height: 1.6;
    padding-block: 28px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  header { display: flex; flex-direction: column; gap: 4px; }
  .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  h1 { font-size: clamp(26px, 6vw, 34px); line-height: 1.2; margin: 0; text-wrap: balance; }
  .lead { margin: 0; color: var(--muted); max-width: 60ch; }

  .search { position: relative; display: block; }
  .search input {
    width: 100%; box-sizing: border-box;
    font: inherit; font-size: 17px; padding: 14px 16px 14px 44px;
    background: var(--surface); color: var(--fg);
    border: 1px solid var(--line); border-radius: 12px;
  }
  .search input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .search svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .hint { font-size: 13px; color: var(--muted); margin: 6px 2px 0; }

  .modules { display: flex; flex-wrap: wrap; gap: 8px; }
  .modules button {
    font: inherit; font-size: 15px; font-weight: 600;
    padding: 7px 16px; border-radius: 999px; cursor: pointer;
    background: var(--surface); color: var(--fg); border: 1px solid var(--line);
  }
  .modules button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .modules button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .modules .n { font-weight: 400; opacity: .75; margin-left: 4px; font-variant-numeric: tabular-nums; }

  .count { font-size: 14px; color: var(--muted); margin: 0; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  details[open] { border-color: var(--accent); }
  summary {
    list-style: none; cursor: pointer; padding: 14px 16px;
    display: flex; gap: 12px; align-items: flex-start;
  }
  summary::-webkit-details-marker { display: none; }
  summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 12px; }
  .icon {
    flex: none; width: 22px; height: 22px; border-radius: 50%; margin-top: 2px;
    background: var(--err); color: var(--surface);
    display: grid; place-items: center; font: 700 14px/1 var(--mono);
  }
  .sum-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .msg { font-family: var(--mono), var(--body); font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 12px; padding: 1px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .tag.team { background: var(--warn-soft); color: var(--warn); }
  .chev { flex: none; color: var(--muted); transition: transform .15s; margin-top: 4px; }
  details[open] .chev { transform: rotate(180deg); }

  .detail { padding: 0 16px 16px 50px; display: flex; flex-direction: column; gap: 14px; }
  .detail h3 { margin: 0 0 2px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .detail p { margin: 0; max-width: 65ch; }
  .solution { background: var(--bg); border-radius: 10px; padding: 12px 14px; }
  .linkbtn {
    align-self: flex-start; font: inherit; font-size: 13px; color: var(--accent);
    background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
  }

  mark { background: var(--warn-soft); color: inherit; border-radius: 3px; padding: 0 1px; }
  .empty { text-align: center; color: var(--muted); padding: 32px 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }

  @media (max-width: 480px) { .detail { padding-left: 16px; } }
  @media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
</style>

  <nav class="modules" id="modules" aria-label="მოდულები"></nav>

  <p class="count" id="count"></p>
  <div class="list" id="list"></div>
</div>

// ===== 2. HELPERS =====
// Errors like "დახურვისას: ..." start with a Georgian word that says WHEN the error shows.
// We split that off and show it as a small tag.
function splitContext(text) {
  const m = text.match(/^([ა-ჿ]+)\s*:\s*(.+)$/);
  return m ? { when: m[1], msg: m[2] } : { when: "", msg: text };
}
// For search: lowercase, drop numbers and punctuation, so "material 2020024227" matches "material 2020000517".
function words(text) {
  return text.toLowerCase().replace(/[0-9]+/g, " ").split(/[^a-zა-ჿ]+/).filter(w => w.length > 1);
}
function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function highlight(text, qWords) {
  let html = escapeHtml(text);
  qWords.forEach(w => {
    const safe = w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    html = html.replace(new RegExp("(" + safe + ")", "gi"), "<mark>$1</mark>");
  });
  return html;
}

ERRORS.forEach((e, i) => {
  e.id = "e" + (i + 1);
  Object.assign(e, splitContext(e.error));
  e.needsTeam = /საპის გუნდ/.test(e.solution);
  e.words = new Set(words(e.error + " " + e.explanation + " " + e.solution));
  e.errWords = new Set(words(e.error));
});

// ===== 3. STATE =====
let currentModule = "ყველა";   // "ყველა" = all modules
const modules = ["ყველა", ...new Set(ERRORS.map(e => e.module))];

// ===== 4. DRAW THE MODULE BUTTONS =====
function drawModules() {
  const nav = document.getElementById("modules");
  nav.innerHTML = "";
  modules.forEach(m => {
    const n = m === "ყველა" ? ERRORS.length : ERRORS.filter(e => e.module === m).length;
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-pressed", m === currentModule);
    b.innerHTML = escapeHtml(m) + '<span class="n">' + n + "</span>";
    b.onclick = () => { currentModule = m; drawModules(); drawList(); };
    nav.append(b);
  });
}

// ===== 5. DRAW THE LIST =====
// Search scores each error by how many of your words it contains.
// Words found in the error text itself count double.
function drawList() {
  const qWords = words(document.getElementById("q").value);
  let rows = ERRORS.filter(e => currentModule === "ყველა" || e.module === currentModule);

  if (qWords.length) {
    rows = rows.map(e => {
      let hits = 0, score = 0;
      qWords.forEach(w => {
        const inErr = [...e.errWords].some(x => x.includes(w));
        const inAll = inErr || [...e.words].some(x => x.includes(w));
        if (inAll) hits++;
        score += inErr ? 2 : inAll ? 1 : 0;
      });
      return { e, hits, score };
    })
    .filter(r => r.hits / qWords.length >= 0.6)
    .sort((a, b) => b.score - a.score)
    .map(r => r.e);
  }

  const list = document.getElementById("list");
  list.innerHTML = "";
  document.getElementById("count").textContent =
    qWords.length ? "ნაპოვნია: " + rows.length : "ერორები: " + rows.length;

  if (!rows.length) {
    list.innerHTML = '<div class="empty">ასეთი ერორი ჯერ არ არის ცნობარში.<br>დაუკავშირდით SAP გუნდს.</div>';
    return;
  }

  rows.forEach((e, i) => {
    const d = document.createElement("details");
    d.id = e.id;
    if (qWords.length && i === 0) d.open = true;   // open the best match
    if (location.hash === "#" + e.id) d.open = true;
    d.innerHTML =
      '<summary>' +
        '<span class="icon" aria-hidden="true">!</span>' +
        '<span class="sum-body">' +
          '<span class="msg">' + highlight(e.msg, qWords) + '</span>' +
          '<span class="tags">' +
            (currentModule === "ყველა" && modules.length > 2 ? '<span class="tag">' + escapeHtml(e.module) + '</span>' : '') +
            (e.when ? '<span class="tag">' + escapeHtml(e.when) + '</span>' : '') +
            (e.needsTeam ? '<span class="tag team">საჭიროა SAP გუნდი</span>' : '') +
          '</span>' +
        '</span>' +
        '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>' +
      '</summary>' +
      '<div class="detail">' +
        '<div><h3>განმარტება</h3><p>' + highlight(e.explanation, qWords) + '</p></div>' +
        '<div class="solution"><h3>მოგვარება</h3><p>' + highlight(e.solution, qWords) + '</p></div>' +
        '<button class="linkbtn" type="button">ბმულის კოპირება</button>' +
      '</div>';

    // "Copy link" gives a link straight to this error, to send to a colleague.
    const btn = d.querySelector(".linkbtn");
    btn.onclick = () => {
      const url = location.href.split("#")[0] + "#" + e.id;
      navigator.clipboard.writeText(url)
        .then(() => { btn.textContent = "დაკოპირდა ✓"; })
        .catch(() => { btn.textContent = url; });
      setTimeout(() => { btn.textContent = "ბმულის კოპირება"; }, 2500);
    };
    list.append(d);
  });
}

document.getElementById("q").addEventListener("input", drawList);
drawModules();
drawList();
if (location.hash) {
  const el = document.querySelector(location.hash);
  if (el) el.scrollIntoView({ block: "center" });
}
</script>
