<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>SAP ერორების ცნობარი</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one reading column. Header with search, module chips, then a list of
     error cards. Error text is styled like an SAP status-bar message. */
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --fg: #17202b;
    --muted: #5d6a79;
    --line: #d6dde5;
    --accent: #0a6ed1;
    --accent-soft: #e3effb;
    --err: #bb0000;
    --err-soft: #fdecec;
    --warn: #8a5300;
    --warn-soft: #fff3df;
    --body: "Noto Sans Georgian", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11161c; --surface: #1a222b; --fg: #e6ebf0; --muted: #98a5b3; --line: #2c3743;
      --accent: #5aa7f0; --accent-soft: #1b3047; --err: #ff7b72; --err-soft: #3a1e20;
      --warn: #f0b45a; --warn-soft: #3a2c15; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11161c; --surface: #1a222b; --fg: #e6ebf0; --muted: #98a5b3; --line: #2c3743;
    --accent: #5aa7f0; --accent-soft: #1b3047; --err: #ff7b72; --err-soft: #3a1e20;
    --warn: #f0b45a; --warn-soft: #3a2c15; color-scheme: dark;
  }

  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--body); font-size: 16px; line-height: 1.6;
    padding-block: 28px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  header { display: flex; flex-direction: column; gap: 4px; }
  .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  h1 { font-size: clamp(26px, 6vw, 34px); line-height: 1.2; margin: 0; text-wrap: balance; }
  .lead { margin: 0; color: var(--muted); max-width: 60ch; }

  .search { position: relative; display: block; }
  .search input {
    width: 100%; box-sizing: border-box;
    font: inherit; font-size: 17px; padding: 14px 16px 14px 44px;
    background: var(--surface); color: var(--fg);
    border: 1px solid var(--line); border-radius: 12px;
  }
  .search input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .search svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .hint { font-size: 13px; color: var(--muted); margin: 6px 2px 0; }

  .modules { display: flex; flex-wrap: wrap; gap: 8px; }
  .modules button {
    font: inherit; font-size: 15px; font-weight: 600;
    padding: 7px 16px; border-radius: 999px; cursor: pointer;
    background: var(--surface); color: var(--fg); border: 1px solid var(--line);
  }
  .modules button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .modules button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .modules .n { font-weight: 400; opacity: .75; margin-left: 4px; font-variant-numeric: tabular-nums; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
  .tabs button {
    font: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
    padding: 10px 14px; margin-bottom: -1px; background: none; color: var(--muted);
    border: 0; border-bottom: 3px solid transparent;
  }
  .tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
  .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .tabs .n { font-weight: 400; opacity: .75; margin-left: 6px; font-variant-numeric: tabular-nums; }
  @media (max-width: 560px) {
    .tabs { gap: 0; }
    .tabs button { flex: 1 1 0; min-width: 0; padding: 8px 4px; font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; }
    .tabs .n { display: block; margin: 2px 0 0; }
  }
  @media (max-width: 440px) { .tabs button { font-size: 13px; padding: 8px 1px; } }
  @media (max-width: 359px) { .tabs { overflow-x: auto; } .tabs button { flex: 0 0 auto; padding: 8px 8px; overflow-wrap: normal; } }

  .count { font-size: 14px; color: var(--muted); margin: 0; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  details[open] { border-color: var(--accent); }
  summary {
    list-style: none; cursor: pointer; padding: 14px 16px;
    display: flex; gap: 12px; align-items: flex-start;
  }
  summary::-webkit-details-marker { display: none; }
  summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 12px; }
  .icon {
    flex: none; width: 22px; height: 22px; border-radius: 50%; margin-top: 2px;
    background: var(--err); color: var(--surface);
    display: grid; place-items: center; font: 700 14px/1 var(--mono);
  }
  .faq .icon { background: var(--accent); }
  .faq .msg { font-family: var(--body); font-weight: 600; }
  .sum-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .msg { font-family: var(--mono), var(--body); font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 12px; padding: 1px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .tag.team { background: var(--warn-soft); color: var(--warn); }
  .tag.shot { background: var(--bg); color: var(--muted); }
  .chev { flex: none; color: var(--muted); transition: transform .15s; margin-top: 4px; }
  details[open] .chev { transform: rotate(180deg); }

  .detail { padding: 0 16px 16px 50px; display: flex; flex-direction: column; gap: 14px; }
  .detail h3 { margin: 0 0 2px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .detail p { margin: 0; max-width: 65ch; white-space: pre-line; }
  .shots { display: flex; flex-direction: column; gap: 8px; }
  .shot-btn { padding: 0; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: zoom-in; overflow: hidden; align-self: flex-start; max-width: 100%; }
  .shot-btn img { display: block; max-width: 100%; max-height: 260px; height: auto; }
  .shot-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  dialog#lightbox { padding: 0; border: 0; background: transparent; max-width: 96vw; max-height: 96vh; cursor: zoom-out; }
  dialog#lightbox::backdrop { background: rgba(0,0,0,.8); }
  dialog#lightbox img { display: block; max-width: 96vw; max-height: 96vh; }
  .solution { background: var(--bg); border-radius: 10px; padding: 12px 14px; }
  .linkbtn {
    align-self: flex-start; font: inherit; font-size: 13px; color: var(--accent);
    background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
  }

  .news { display: flex; flex-direction: column; gap: 10px; }
  .news[hidden] { display: none; }
  .news h2 { margin: 0; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .post { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 12px;
          background: var(--accent-soft); border: 1px solid var(--accent); }
  .post-meta { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .post-meta .badge { font-weight: 700; font-size: 12px; color: #fff; background: var(--accent); border-radius: 999px; padding: 1px 9px; }
  .post p { margin: 0; font-weight: 600; max-width: 70ch; }
  .post a { align-self: flex-start; font-size: 15px; font-weight: 600; color: var(--accent); text-underline-offset: 3px; }

  .browse { display: flex; flex-direction: column; gap: 18px; }
  .browse[hidden], .reader[hidden] { display: none; }

  .instr { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; font: inherit; color: inherit;
           padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
  .instr:hover { border-color: var(--accent); }
  .instr:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .instr .icon { background: var(--accent); }
  .instr .msg { font-family: var(--body); font-weight: 600; }
  .snippet { font-size: 14px; color: var(--muted); }

  .reader { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .reader-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .back { font: inherit; font-size: 15px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .reader .tag { align-self: flex-start; }
  .reader h2 { margin: 0; font-size: clamp(21px, 5vw, 26px); line-height: 1.3; text-wrap: balance; }
  .doc { overflow-wrap: anywhere; }
  .doc p, .doc li { max-width: 70ch; }
  .doc h1, .doc h2, .doc h3 { font-size: 18px; margin: 1.4em 0 .4em; }
  .doc img { display: block; max-width: 100%; height: auto; margin: 10px 0; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: zoom-in; }
  .doc video { display: block; width: 100%; border-radius: 8px; background: #000; }
  .doc blockquote { margin: 0; padding-left: 14px; border-left: 3px solid var(--line); }
  .doc .table-wrap { overflow-x: auto; margin: 10px 0; }
  .doc table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
  .doc th, .doc td { border: 1px solid var(--line); padding: 6px 8px; vertical-align: top; text-align: left; }
  .doc th { background: var(--bg); }
  .doc a { color: var(--accent); }

  mark { background: var(--warn-soft); color: inherit; border-radius: 3px; padding: 0 1px; }
  .empty { text-align: center; color: var(--muted); padding: 32px 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }

  @media (max-width: 480px) { .detail { padding-left: 16px; } }
  @media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
</style>
  </head>
<body>

<div class="wrap">
  <header>
    <span class="eyebrow">SAP · ერორები</span>
    <h1>SAP ერორების ცნობარი</h1>
    <p class="lead">ჩასვით ერორის ტექსტი, დასვით კითხვა ან მოძებნეთ ინსტრუქცია. თითოეულ ჩანაწერზე ნახავთ განმარტებას და მოგვარების გზას.</p>
  </header>

  <section class="news" id="news" aria-label="სიახლეები" hidden></section>

  <nav class="tabs" id="tabs" role="tablist" aria-label="განყოფილებები"></nav>

  <div id="browse" class="browse">
  <div>
    <label class="search" for="q">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="მაგ: cannot be confirmed due to its status" autocomplete="off" aria-label="ძებნა">
    </label>
    <p class="hint">ნომრები (მასალა, განაცხადი, კონტრაქტი) ძებნისას არ ითვლება, ასე რომ შეგიძლიათ მთლიანი ერორი ჩასვათ.</p>
  </div>

  <nav class="modules" id="modules" aria-label="მოდულები"></nav>

  <p class="count" id="count"></p>
  <div class="list" id="list"></div>
  </div>

  <article id="reader" class="reader" hidden>
    <div class="reader-bar">
      <button type="button" class="back" id="reader-back">← ყველა ინსტრუქცია</button>
      <button type="button" class="linkbtn" id="reader-link">ბმულის კოპირება</button>
    </div>
    <span class="tag" id="reader-module"></span>
    <h2 id="reader-title"></h2>
    <div class="doc" id="reader-body"></div>
  </article>
</div>

<dialog id="lightbox" aria-label="სქრინი"><img id="lightbox-img" alt=""></dialog>

<script src="instructions.js"></script>
<script src="news.js"></script>

// ===== 2. HELPERS =====
// Errors like "დახურვისას: ..." start with a Georgian word that says WHEN the error shows.
// We split that off and show it as a small tag.
function splitContext(text) {
  const m = text.match(/^([ა-ჿ]+)\s*:\s*(.+)$/);
  return m ? { when: m[1], msg: m[2] } : { when: "", msg: text };
}
// For search: lowercase, drop numbers and punctuation, so "material 2020024227" matches "material 2020000517".
function words(text) {
  return text.toLowerCase().replace(/[0-9]+/g, " ").split(/[^a-zა-ჿ]+/).filter(w => w.length > 1);
}
function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
// Match all words in one pass on the raw text, then escape each piece, so a search
// word can never land inside an HTML entity or an inserted <mark> tag.
function highlight(text, qWords) {
  if (!qWords.length) return escapeHtml(text);
  const alts = qWords
    .map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))
    .sort((a, b) => b.length - a.length);
  return text.split(new RegExp("(" + alts.join("|") + ")", "gi"))
    .map((part, i) => i % 2 ? "<mark>" + escapeHtml(part) + "</mark>" : escapeHtml(part))
    .join("");
}

// Errors, FAQ and instructions share one shape: title, explanation, answer (instructions: their full text).
const docText = html => new DOMParser().parseFromString(html, "text/html").body.textContent.replace(/\s+/g, " ").trim();
const TABS = {
  errors: { label: "ერორები", inLabel: "ერორებშიც", icon: "!", answerTitle: "მოგვარება", placeholder: "მაგ: cannot be confirmed due to its status",
            items: ERRORS.map((e, i) => ({ ...e, id: "e" + (i + 1), title: e.error, answer: e.solution })) },
  faq:    { label: "ხშირი კითხვები", inLabel: "ხშირ კითხვებშიც", icon: "?", answerTitle: "პასუხი", placeholder: "მაგ: ძველი თარიღით ზედნადები",
            items: FAQ.map((f, i) => ({ ...f, id: "f" + (i + 1), title: f.question })) },
  instr:  { label: "ინსტრუქციები", inLabel: "ინსტრუქციებშიც", icon: "i", placeholder: "მაგ: დაბრუნება, ZCART, ინვოისი",
            items: INSTRUCTIONS.map(x => ({ ...x, id: "i-" + x.id, answer: docText(x.html) })) },
};
Object.values(TABS).forEach(t => t.items.forEach(e => {
  Object.assign(e, splitContext(e.title));
  e.explanation = e.explanation || "";
  e.images = e.images || [];
  e.needsTeam = /საპის გუნდ/.test(e.answer);
  e.words = new Set(words(e.title + " " + e.explanation + " " + e.answer));
  e.titleWords = new Set(words(e.title));
}));
const tabOfHash = h => h.startsWith("#f") ? "faq" : h.startsWith("#i-") ? "instr" : "errors";

// ===== 3. STATE =====
let currentTab = tabOfHash(location.hash);
let currentModule = "ყველა";   // "ყველა" = all modules

// Search scores each item by how many of your words it contains.
// Words found in the title itself count double.
function search(items, qWords) {
  if (!qWords.length) return items;
  return items.map(e => {
    let hits = 0, score = 0;
    qWords.forEach(w => {
      const inTitle = [...e.titleWords].some(x => x.includes(w));
      const inAll = inTitle || [...e.words].some(x => x.includes(w));
      if (inAll) hits++;
      score += inTitle ? 2 : inAll ? 1 : 0;
    });
    return { e, hits, score };
  })
  .filter(r => r.hits / qWords.length >= 0.6)
  .sort((a, b) => b.score - a.score)
  .map(r => r.e);
}
function modulesOf(tab) {
  return ["ყველა", ...new Set(TABS[tab].items.map(e => e.module))];
}
function switchTab(tab, keepHash) {
  currentTab = tab;
  if (!modulesOf(tab).includes(currentModule)) currentModule = "ყველა";
  document.getElementById("q").placeholder = TABS[tab].placeholder;
  if (!keepHash && location.hash.startsWith("#i-")) history.replaceState(null, "", location.pathname + location.search);
  showReader(null);
  drawTabs(); drawModules(); drawList();
}

// ===== 4. DRAW THE TABS AND MODULE BUTTONS =====
function drawTabs() {
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  Object.entries(TABS).forEach(([key, t]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", key === currentTab);
    b.innerHTML = escapeHtml(t.label) + '<span class="n">' + t.items.length + "</span>";
    b.onclick = () => switchTab(key);
    nav.append(b);
  });
}
function drawModules() {
  const nav = document.getElementById("modules");
  const items = TABS[currentTab].items;
  nav.innerHTML = "";
  modulesOf(currentTab).forEach(m => {
    const n = m === "ყველა" ? items.length : items.filter(e => e.module === m).length;
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-pressed", m === currentModule);
    b.innerHTML = escapeHtml(m) + '<span class="n">' + n + "</span>";
    b.onclick = () => { currentModule = m; drawModules(); drawList(); };
    nav.append(b);
  });
}

// "Copy link" gives a link straight to one item, to send to a colleague.
function copyLink(btn, id) {
  const url = location.href.split("#")[0] + "#" + id;
  navigator.clipboard.writeText(url)
    .then(() => { btn.textContent = "დაკოპირდა ✓"; })
    .catch(() => { btn.textContent = url; });
  setTimeout(() => { btn.textContent = "ბმულის კოპირება"; }, 2500);
}
function openLightbox(src) {
  document.getElementById("lightbox-img").src = src;
  document.getElementById("lightbox").showModal();
}
// A short piece of an instruction's text around the first search word.
function snippet(text, qWords) {
  const lower = text.toLowerCase();
  const at = Math.min(...qWords.map(w => lower.indexOf(w)).filter(i => i >= 0));
  if (!isFinite(at)) return "";
  const start = Math.max(0, at - 50);
  return (start ? "…" : "") + text.slice(start, at + 90) + "…";
}

// ===== 5. DRAW THE LIST =====
function drawList() {
  const tab = TABS[currentTab];
  const qWords = words(document.getElementById("q").value);
  const inModule = e => currentModule === "ყველა" || e.module === currentModule;
  const rows = search(tab.items.filter(inModule), qWords);
  const showModuleTag = currentModule === "ყველა" && modulesOf(currentTab).length > 2;

  // When searching, also say how many matches the other tabs have.
  const count = document.getElementById("count");
  count.textContent = (qWords.length ? "ნაპოვნია: " : tab.label + ": ") + rows.length;
  if (qWords.length) {
    Object.keys(TABS).filter(k => k !== currentTab).forEach(other => {
      const n = search(TABS[other].items, qWords).length;
      if (!n) return;
      const b = document.createElement("button");
      b.type = "button"; b.className = "linkbtn";
      b.textContent = TABS[other].inLabel + ": " + n;
      b.onclick = () => switchTab(other);
      count.append(" · ", b);
    });
  }

  const list = document.getElementById("list");
  list.innerHTML = "";
  if (!rows.length) {
    list.innerHTML = '<div class="empty">ასეთი ჩანაწერი ჯერ არ არის ცნობარში.<br>დაუკავშირდით SAP გუნდს.</div>';
    return;
  }

  // Instructions: one row each, opening a full-page reader.
  if (currentTab === "instr") {
    rows.forEach(e => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "instr";
      const snip = qWords.length ? snippet(e.answer, qWords) : "";
      b.innerHTML =
        '<span class="icon" aria-hidden="true">i</span>' +
        '<span class="sum-body">' +
          '<span class="msg">' + highlight(e.title, qWords) + '</span>' +
          (snip ? '<span class="snippet">' + highlight(snip, qWords) + '</span>' : '') +
          (showModuleTag ? '<span class="tags"><span class="tag">' + escapeHtml(e.module) + '</span></span>' : '') +
        '</span>';
      b.onclick = () => { openedFromList = true; location.hash = e.id; };
      list.append(b);
    });
    return;
  }

  rows.forEach((e, i) => {
    const d = document.createElement("details");
    d.id = e.id;
    if (currentTab === "faq") d.className = "faq";
    if (qWords.length && i === 0) d.open = true;   // open the best match
    if (location.hash === "#" + e.id) d.open = true;
    d.innerHTML =
      '<summary>' +
        '<span class="icon" aria-hidden="true">' + tab.icon + '</span>' +
        '<span class="sum-body">' +
          '<span class="msg">' + highlight(e.msg, qWords) + '</span>' +
          '<span class="tags">' +
            (showModuleTag ? '<span class="tag">' + escapeHtml(e.module) + '</span>' : '') +
            (e.when ? '<span class="tag">' + escapeHtml(e.when) + '</span>' : '') +
            (e.needsTeam ? '<span class="tag team">საჭიროა SAP გუნდი</span>' : '') +
            (e.images.length ? '<span class="tag shot">სქრინით</span>' : '') +
          '</span>' +
        '</span>' +
        '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>' +
      '</summary>' +
      '<div class="detail">' +
        (e.explanation ? '<div><h3>განმარტება</h3><p>' + highlight(e.explanation, qWords) + '</p></div>' : '') +
        '<div class="solution"><h3>' + tab.answerTitle + '</h3><p>' + highlight(e.answer, qWords) + '</p></div>' +
        (e.images.length ? '<div class="shots">' + e.images.map(src =>
          '<button type="button" class="shot-btn" aria-label="სქრინის გადიდება"><img src="' + escapeHtml(src) + '" alt="" loading="lazy"></button>'
        ).join("") + '</div>' : '') +
        '<button class="linkbtn" type="button">ბმულის კოპირება</button>' +
      '</div>';

    // Tap a screenshot to see it full size.
    d.querySelectorAll(".shot-btn").forEach(b => {
      b.onclick = () => openLightbox(b.querySelector("img").src);
    });
    const btn = d.querySelector(".linkbtn");
    btn.onclick = () => copyLink(btn, e.id);
    list.append(d);
  });
}

// ===== 6. NEWS FEED =====
// A post is shown from its date for "days" days (see news.js).
const MONTHS = ["იან", "თებ", "მარ", "აპრ", "მაი", "ივნ", "ივლ", "აგვ", "სექ", "ოქტ", "ნოე", "დეკ"];
function drawNews() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const live = NEWS.filter(n => {
    const from = new Date(n.date + "T00:00:00");
    const until = new Date(from); until.setDate(until.getDate() + (n.days || 5));
    return from <= today && today < until;
  }).sort((a, b) => b.date.localeCompare(a.date));
  const box = document.getElementById("news");
  box.innerHTML = live.length ? "<h2>სიახლეები</h2>" : "";
  live.forEach(n => {
    const d = new Date(n.date + "T00:00:00");
    const guide = n.instruction && TABS.instr.items.find(x => x.id === "i-" + n.instruction);
    const post = document.createElement("article");
    post.className = "post";
    post.innerHTML =
      '<div class="post-meta"><span class="badge">ახალი</span><span>' + d.getDate() + " " + MONTHS[d.getMonth()] + '</span></div>' +
      '<p>' + escapeHtml(n.text) + '</p>' +
      (guide ? '<a href="#' + guide.id + '">ინსტრუქციის ნახვა →</a>' : '');
    box.append(post);
  });
  box.dataset.count = live.length;
}

// ===== 7. INSTRUCTION READER =====
// Opened by a "#i-..." link, so the browser's back button returns to the list.
let openedFromList = false;
function showReader(e) {
  document.getElementById("browse").hidden = !!e;
  document.getElementById("reader").hidden = !e;
  const news = document.getElementById("news");
  news.hidden = !!e || news.dataset.count === "0";
  if (!e) return;
  document.getElementById("reader-module").textContent = e.module;
  document.getElementById("reader-title").textContent = e.title;
  const body = document.getElementById("reader-body");
  body.innerHTML = e.html;
  body.querySelectorAll("table").forEach(t => {
    const wrap = document.createElement("div");
    wrap.className = "table-wrap";
    t.replaceWith(wrap); wrap.append(t);
  });
  body.querySelectorAll("a[href]").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
  body.querySelectorAll("img").forEach(img => { img.onclick = () => openLightbox(img.src); });
  const link = document.getElementById("reader-link");
  link.onclick = () => copyLink(link, e.id);
  window.scrollTo(0, 0);
}
function route() {
  const h = location.hash;
  if (h.startsWith("#i-")) {
    const e = TABS.instr.items.find(x => "#" + x.id === h);
    if (e) {
      if (currentTab !== "instr") { currentTab = "instr"; drawTabs(); drawModules(); drawList(); }
      showReader(e);
      return;
    }
  }
  showReader(null);
}
document.getElementById("reader-back").onclick = () => {
  if (openedFromList) { openedFromList = false; history.back(); }
  else location.hash = "";
};
window.addEventListener("hashchange", route);

const lightbox = document.getElementById("lightbox");
lightbox.onclick = () => lightbox.close();

document.getElementById("q").addEventListener("input", drawList);
drawNews();
switchTab(currentTab, true);
route();
if (/^#[ef]\d+$/.test(location.hash)) {
  const el = document.querySelector(location.hash);
  if (el) el.scrollIntoView({ block: "center" });
}
